services:
  gemini-api:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-7860}:${PORT:-7860}"
    volumes:
      - ./data:/app/data
    environment:
      SWITCH_ON_USES: ${SWITCH_ON_USES:-40}
      FAILURE_THRESHOLD: ${FAILURE_THRESHOLD:-3}
      IMMEDIATE_SWITCH_STATUS_CODES: ${IMMEDIATE_SWITCH_STATUS_CODES:-429,503}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-300}
      GEMINI_AUTO_REFRESH: ${GEMINI_AUTO_REFRESH:-true}
      GEMINI_AUTH_HEADLESS: ${GEMINI_AUTH_HEADLESS:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-admin-password}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-change-this-to-a-long-random-string}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-true}
      API_KEYS: ${API_KEYS:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://your-panel.example.com}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-7860}
      GIT_COMMIT: ${GIT_COMMIT:-}
      OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-false}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-gemini-web}
      OBJECT_STORAGE_PUBLIC_URL: ${OBJECT_STORAGE_PUBLIC_URL:-}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
